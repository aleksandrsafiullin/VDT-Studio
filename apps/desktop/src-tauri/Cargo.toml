[package]
name = "vdt-studio-desktop"
version = "0.1.0-alpha.2"
description = "VDT Studio Desktop app"
authors = ["VDT Studio"]
edition = "2021"
license = "MIT"

[lib]
name = "vdt_studio_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = [] }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
socket2 = "0.6.5"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_NetworkManagement_IpHelper", "Win32_Networking_WinSock", "Win32_UI_WindowsAndMessaging"] }

[profile.release.build-override]
# Keep macOS dyld alignment on host proc-macro libraries.
strip = "none"
