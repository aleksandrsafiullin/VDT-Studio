name: Release Source Verification
on:
  workflow_dispatch:
  push:
    tags: ["v*-alpha.*"]
permissions:
  contents: read
jobs:
  alpha:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm release:verify
      - run: pnpm build:web
        env:
          NEXT_PUBLIC_VDT_APP_MODE: development_web
          NEXT_PUBLIC_VDT_ENABLE_STANDALONE_RUNNER: "true"
      - run: pnpm exec playwright install --with-deps chromium webkit
      - run: pnpm test:e2e
        env:
          VDT_E2E_USE_BUILD: "1"
      - name: Verify saved-copy recovery with real storage
        run: pnpm test:e2e:saved-copy
        env:
          VDT_E2E_SAVED_COPY_BROWSER: chromium
      - uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: output/release/sbom.spdx.json
      - name: Preserve source artifacts and failed verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-release-verification-${{ github.sha }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            output/release/v*/vdt-studio-cli-*.tgz
            output/release/v*/SHA256SUMS
            output/release/v*/manifest.json
            output/release/v*/sbom.spdx.json
            output/release/sbom.spdx.json
            output/playwright/
            test-results/
