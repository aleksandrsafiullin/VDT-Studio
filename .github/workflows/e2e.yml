name: E2E
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:web
        env:
          NEXT_PUBLIC_VDT_APP_MODE: development_web
          NEXT_PUBLIC_VDT_ENABLE_STANDALONE_RUNNER: "true"
      - run: pnpm exec playwright install --with-deps chromium webkit
      - run: pnpm test:e2e
        env:
          VDT_E2E_USE_BUILD: "1"
      - name: Verify saved-copy recovery with real storage
        run: pnpm test:e2e:saved-copy
        env:
          VDT_E2E_SAVED_COPY_BROWSER: chromium
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-e2e-results
          path: |
            output/playwright/
            test-results/
          retention-days: 7
