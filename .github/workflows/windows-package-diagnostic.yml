name: Diagnose verified Windows package startup

on:
  workflow_dispatch:
  push:
    branches: ["codex/windows-package-diagnostic-*"]

permissions:
  contents: read
  actions: read

jobs:
  diagnose:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve exact previous package
        uses: actions/download-artifact@v4
        with:
          name: native-windows-validation-ebfad678759f5c0e98c2082519fb5b552aa24bb6
          run-id: 43500323361
          github-token: ${{ github.token }}
          path: output/windows-diagnostic/input
      - name: Install and observe packaged startup as a standard user
        shell: pwsh
        run: ./.github/scripts/windows-package-diagnostic.ps1
      - name: Preserve startup diagnostics and cleanup result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-package-diagnostic-${{ github.run_id }}
          path: output/windows-diagnostic/evidence/
          if-no-files-found: warn
